# Default tier policy: openhands_sdk for BOTH single-turn and multi-turn.
# This is a v1 config (tiers.<name>.providers[]). Under v1 the tier providers[]
# drive provider selection for every package — single-turn and multi-turn alike
# route through the SDK bridge — so there is no separate [multiturn] block and
# [runtime].provider_id is NOT used for provider selection.
#
# NOTE: openhands_sdk needs OPENAI_API_KEY (model openai/*) + the uv/Python 3.12
# toolchain. Single-turn prompts MUST instruct "plain text only, no tools" or the
# model wraps its reply in finish/think tool calls and the harness sees empty
# output. Per-tier models can differ; default is gpt-4o-mini across all tiers.
version = "v1"
default_tier = "light"

[runtime]
provider_id = "file://scripts/framework/opencode-cli-provider.js"
opencode_config = "opencode.json"
project_dir = "../.."
format = "default"
log_level = "ERROR"
print_logs = false
empty_output_retries = 1

[tiers.light]
providers = [{ provider_kind = "openhands_sdk", model = "openai/gpt-4o-mini", label = "openhands-sdk/gpt-4o-mini" }]

[tiers.standard]
providers = [{ provider_kind = "openhands_sdk", model = "openai/gpt-4o-mini", label = "openhands-sdk/gpt-4o-mini" }]

[tiers.high]
providers = [{ provider_kind = "openhands_sdk", model = "openai/gpt-4o-mini", label = "openhands-sdk/gpt-4o-mini" }]

[tiers.x_high]
providers = [{ provider_kind = "openhands_sdk", model = "openai/gpt-4o-mini", label = "openhands-sdk/gpt-4o-mini" }]
