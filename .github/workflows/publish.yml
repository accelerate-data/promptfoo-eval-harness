name: Publish

# Triggered by a version tag push (e.g. v1.0.0, v1.0.0-canary.1, v1.2.0-rc.1).
# Can also be triggered manually via workflow_dispatch for emergency re-publish.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      skip_nightly_gate:
        description: 'Skip nightly gate (use only when SKIP_NIGHTLY_GATE_FIRST_RELEASE secret is set)'
        required: false
        default: 'false'

permissions:
  contents: read
  id-token: write   # required for npm provenance attestation

# ---------------------------------------------------------------------------
# Job 1: test — matrix over python versions (ubuntu-latest × {3.12, 3.13})
# ---------------------------------------------------------------------------
jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v6
        with:
          # fetch full history so `git describe` works and tags are available
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      # Cache the uv package store keyed on SDK pins — avoids re-downloading
      # openhands-sdk on every run when the pin hasn't changed.
      - name: Cache uv package store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/uv
          key: uv-${{ matrix.python-version }}-${{ hashFiles('config/sdk-pins.toml') }}
          restore-keys: |
            uv-${{ matrix.python-version }}-

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Pre-warm openhands-sdk uv cache (doctor --install-providers)
        # Matches the spawn spec in _node_bridge.js. AD_EVALS_OFFLINE is NOT set
        # here — this step IS the warm-up.
        run: |
          source $HOME/.cargo/env 2>/dev/null || true
          node bin/ad-evals.js doctor --install-providers

      - name: npm test
        run: npm test

      - name: pytest
        run: |
          source $HOME/.cargo/env 2>/dev/null || true
          uv run --python ${{ matrix.python-version }} pytest -q

      - name: Run all framework scenarios (mock mode, no live keys)
        # Outer concurrency intentionally unset — each scenario gets its own
        # PROMPTFOO_CONFIG_DIR so the SQLite state DB is isolated (spec §5.3).
        env:
          OPENCODE_MOCK_MODE: '1'
          PYTHONPATH: ${{ github.workspace }}/tests/_mock_openhands_sdk
        run: |
          source $HOME/.cargo/env 2>/dev/null || true
          node bin/ad-evals.js run tests/harness-scenarios/packages

# ---------------------------------------------------------------------------
# Job 2: publish — single-shot (not matrix) after both test matrix legs pass
# ---------------------------------------------------------------------------
  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.12'

      - name: Cache uv package store (publish job)
        uses: actions/cache@v4
        with:
          path: ~/.local/share/uv
          key: uv-3.12-${{ hashFiles('config/sdk-pins.toml') }}
          restore-keys: |
            uv-3.12-

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      # ---------------------------------------------------------------------------
      # Nightly gate: assert that nightly-scenarios.yml has been green for at least
      # two consecutive runs on main before we publish.
      #
      # Escape hatch: set repository secret SKIP_NIGHTLY_GATE_FIRST_RELEASE=true
      # to bypass this check for the very first publish (v1.0.0) before nightly
      # history exists on main. REMOVE the secret after v1.0.0 is published — all
      # subsequent releases (v1.0.1+) MUST pass the gate organically.
      # See docs/release-readiness.md for the full rationale.
      # ---------------------------------------------------------------------------
      - name: Nightly gate — assert 2 consecutive green nightly runs on main
        if: ${{ secrets.SKIP_NIGHTLY_GATE_FIRST_RELEASE != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GREEN_COUNT=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/nightly-scenarios.yml/runs?branch=main&status=success&per_page=2" \
            --jq '.workflow_runs | length' 2>/dev/null || echo 0)
          echo "Consecutive nightly-green runs on main: ${GREEN_COUNT}"
          if [ "${GREEN_COUNT}" -lt 2 ]; then
            echo "::error::Nightly gate failed — fewer than 2 consecutive successful nightly runs on main."
            echo "::error::Either wait for two nightly runs to pass, or set SKIP_NIGHTLY_GATE_FIRST_RELEASE=true (v1.0.0 only)."
            exit 1
          fi

      # ---------------------------------------------------------------------------
      # Derive npm dist-tag from the git tag:
      #   v1.0.0-canary.N  → canary
      #   v1.0.0-next.N    → next
      #   v1.0.0-beta.N    → next
      #   v1.0.0-rc.N      → next
      #   v1.0.0           → latest
      # ---------------------------------------------------------------------------
      - name: Derive npm dist-tag from version
        id: tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ "$VERSION" == *-canary* ]]; then
            TAG=canary
          elif [[ "$VERSION" == *-* ]]; then
            TAG=next
          else
            TAG=latest
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "Resolved npm tag: $TAG (version: $VERSION)"

      - name: Publish to npm (${{ steps.tag.outputs.npm_tag }})
        run: |
          npm publish --provenance --access public --tag ${{ steps.tag.outputs.npm_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
