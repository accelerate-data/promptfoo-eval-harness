name: Release

on:
  push:
    tags:
      - 'v*'
  # Added from publish.yml: manual trigger for emergency re-publish.
  workflow_dispatch:
    inputs:
      skip_nightly_gate:
        description: 'Skip nightly gate (use only when SKIP_NIGHTLY_GATE_FIRST_RELEASE secret is set)'
        required: false
        default: 'false'

permissions:
  contents: write
  id-token: write

jobs:
  # Test job mirrors ci.yml's matrix (py 3.12/3.13) — uv sync + npm test.
  # pytest + framework-scenarios steps from publish.yml are deferred as
  # follow-up tickets (pre-existing failures unrelated to v1.5.0 scope).
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Sync Python dependencies
        run: uv sync --frozen
      - run: npm ci --no-audit --no-fund
      - run: npm test

  # ---------------------------------------------------------------------------
  # release job — preserves the ORIGINAL release.yml content verbatim, with
  # only additions interleaved (nightly gate + dist-tag derivation + --tag flag).
  # ---------------------------------------------------------------------------
  release:
    needs: test   # Added: gate behind test job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history required: the phase-04 byte-identity contract test
          # (opencode-cli-plugin-provider.test.js) runs `git diff` against the
          # parent SHA recorded in tests/_fixtures/phase-04-parent.sha — same
          # rationale as ci.yml.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci --no-audit --no-fund
      - run: npm test

      # Added from publish.yml: nightly gate.
      # Asserts nightly-scenarios.yml has been green for at least 2 consecutive
      # runs on main before we publish. Escape hatch: secret
      # SKIP_NIGHTLY_GATE_FIRST_RELEASE=true bypasses (first release only),
      # OR workflow_dispatch input skip_nightly_gate=true for emergency re-publish.
      # GitHub Actions disallows `secrets.*` directly in step-level `if:`
      # conditionals — bind them to env vars first and branch inside `run:`.
      - name: Nightly gate — assert 2 consecutive green nightly runs on main
        env:
          SKIP_GATE_SECRET: ${{ secrets.SKIP_NIGHTLY_GATE_FIRST_RELEASE }}
          DISPATCH_SKIP_INPUT: ${{ github.event.inputs.skip_nightly_gate }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${SKIP_GATE_SECRET}" = "true" ] || [ "${DISPATCH_SKIP_INPUT}" = "true" ]; then
            echo "Nightly gate skipped (SKIP_GATE_SECRET=${SKIP_GATE_SECRET}, DISPATCH_SKIP_INPUT=${DISPATCH_SKIP_INPUT})."
            exit 0
          fi
          GREEN_COUNT=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/nightly-scenarios.yml/runs?branch=main&status=success&per_page=2" \
            --jq '.workflow_runs | length' 2>/dev/null || echo 0)
          echo "Consecutive nightly-green runs on main: ${GREEN_COUNT}"
          if [ "${GREEN_COUNT}" -lt 2 ]; then
            echo "::error::Nightly gate failed — fewer than 2 consecutive successful nightly runs on main."
            echo "::error::Either wait for two nightly runs to pass, or set SKIP_NIGHTLY_GATE_FIRST_RELEASE=true (first release only)."
            exit 1
          fi

      # Added from publish.yml: derive npm dist-tag from version suffix.
      #   v1.0.0-canary.N → canary | v1.0.0-{next,beta,rc}.N → next | v1.0.0 → latest
      - name: Derive npm dist-tag from version
        id: tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ "$VERSION" == *-canary* ]]; then
            TAG=canary
          elif [[ "$VERSION" == *-* ]]; then
            TAG=next
          else
            TAG=latest
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "Resolved npm tag: $TAG (version: $VERSION)"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo '')"
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:'- %s (%h)' "$PREV_TAG..${GITHUB_REF_NAME}" > CHANGELOG_TMP.md
          else
            git log --pretty=format:'- %s (%h)' > CHANGELOG_TMP.md
          fi
      - uses: softprops/action-gh-release@v3
        with:
          body_path: CHANGELOG_TMP.md
          generate_release_notes: true
      # Original npm publish, augmented with --tag from publish.yml dist-tag step.
      - run: npm publish --provenance --access public --tag ${{ steps.tag.outputs.npm_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
