name: Release

on:
  push:
    tags:
      - 'v*'
  # Added from publish.yml: manual trigger for emergency re-publish.
  workflow_dispatch:
    inputs:
      skip_nightly_gate:
        description: 'Skip nightly gate (use only when SKIP_NIGHTLY_GATE_FIRST_RELEASE secret is set)'
        required: false
        default: 'false'

permissions:
  contents: write
  id-token: write

jobs:
  # ---------------------------------------------------------------------------
  # Added from publish.yml: test job (matrix py 3.12/3.13) — runs before release
  # to validate Node + Python bridge + smoke scenarios in mock mode.
  # ---------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache uv package store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/uv
          key: uv-${{ matrix.python-version }}-${{ hashFiles('config/sdk-pins.toml') }}
          restore-keys: |
            uv-${{ matrix.python-version }}-
      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Pre-warm openhands-sdk uv cache (doctor --install-providers)
        run: |
          source $HOME/.cargo/env 2>/dev/null || true
          node bin/ad-evals.js doctor --install-providers
      - name: npm test
        run: npm test
      - name: pytest
        run: |
          source $HOME/.cargo/env 2>/dev/null || true
          uv run --python ${{ matrix.python-version }} pytest -q
      - name: Run all framework scenarios (mock mode, no live keys)
        env:
          OPENCODE_MOCK_MODE: '1'
          PYTHONPATH: ${{ github.workspace }}/tests/_mock_openhands_sdk
        run: |
          source $HOME/.cargo/env 2>/dev/null || true
          node bin/ad-evals.js run tests/harness-scenarios/packages

  # ---------------------------------------------------------------------------
  # release job — preserves the ORIGINAL release.yml content verbatim, with
  # only additions interleaved (nightly gate + dist-tag derivation + --tag flag).
  # ---------------------------------------------------------------------------
  release:
    needs: test   # Added: gate behind test job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci --no-audit --no-fund
      - run: npm test

      # Added from publish.yml: nightly gate.
      # Asserts nightly-scenarios.yml has been green for at least 2 consecutive
      # runs on main before we publish. Escape hatch: secret
      # SKIP_NIGHTLY_GATE_FIRST_RELEASE=true bypasses (first release only),
      # OR workflow_dispatch input skip_nightly_gate=true for emergency re-publish.
      - name: Nightly gate — assert 2 consecutive green nightly runs on main
        if: ${{ secrets.SKIP_NIGHTLY_GATE_FIRST_RELEASE != 'true' && github.event.inputs.skip_nightly_gate != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GREEN_COUNT=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/nightly-scenarios.yml/runs?branch=main&status=success&per_page=2" \
            --jq '.workflow_runs | length' 2>/dev/null || echo 0)
          echo "Consecutive nightly-green runs on main: ${GREEN_COUNT}"
          if [ "${GREEN_COUNT}" -lt 2 ]; then
            echo "::error::Nightly gate failed — fewer than 2 consecutive successful nightly runs on main."
            echo "::error::Either wait for two nightly runs to pass, or set SKIP_NIGHTLY_GATE_FIRST_RELEASE=true (first release only)."
            exit 1
          fi

      # Added from publish.yml: derive npm dist-tag from version suffix.
      #   v1.0.0-canary.N → canary | v1.0.0-{next,beta,rc}.N → next | v1.0.0 → latest
      - name: Derive npm dist-tag from version
        id: tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ "$VERSION" == *-canary* ]]; then
            TAG=canary
          elif [[ "$VERSION" == *-* ]]; then
            TAG=next
          else
            TAG=latest
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "Resolved npm tag: $TAG (version: $VERSION)"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo '')"
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:'- %s (%h)' "$PREV_TAG..${GITHUB_REF_NAME}" > CHANGELOG_TMP.md
          else
            git log --pretty=format:'- %s (%h)' > CHANGELOG_TMP.md
          fi
      - uses: softprops/action-gh-release@v3
        with:
          body_path: CHANGELOG_TMP.md
          generate_release_notes: true
      # Original npm publish, augmented with --tag from publish.yml dist-tag step.
      - run: npm publish --provenance --access public --tag ${{ steps.tag.outputs.npm_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
